[project]
name = "allergy-tracker"
version = "0.1.0"
description = "Daily allergy symptom tracker correlated with local pollen, weather and air quality"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "pywebpush>=2.0.0",
    "py-vapid>=1.9.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008 is the documented FastAPI pattern for Body/Depends defaults.
ignore = ["B008"]

[tool.setuptools.package-data]
app = ["static/*"]
